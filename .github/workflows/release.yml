name: release

# Publishes dusk-crux to npm through the reusable package pipeline —
# Dusk-Inc/dusk-workspace/.github/workflows/package.yml, archetype C. This file is a caller
# stub and carries no publish logic of its own.
#
# What the shared pipeline does with these inputs:
#
#   No stored token, ever. `id-token: write` plus the `npm` environment ARE the credential:
#   npm exchanges a short-lived OIDC claim for a publish grant, and there is nothing on this
#   repository for anyone to steal. That is this repo's own technique, kept.
#
#   Changesets owns the version, and nothing else does. release-please and every other
#   Conventional-Commits tool parses `feat:`/`fix:` subject lines, which cannot coexist with
#   the `[<step>][feat-M] <unit>: <summary>` schema commit-tag-guard.py enforces on every
#   commit in every Unit repo. Changesets reads intent from `.changeset/*.md` files instead, so
#   it is indifferent to the subject line. A push to dev opens or refreshes the
#   "[infra] dusk-crux: version packages" pull request; nothing publishes from dev.
#
#   npm versions are immutable, so staging and main MUST differ. staging publishes
#   `<base>-rc.<run>` under the `rc` dist-tag, main publishes `<base>` under `latest`. A pull
#   request and a push to dev build, test and pack, and publish nothing.
#
# `access: public` keeps this package public and is what lets the shared pipeline attach
# provenance — npm rejects `--provenance` on a restricted package.

on:
  pull_request:
    branches: [dev, staging, main]
  push:
    branches: [dev, staging, main]
  workflow_dispatch:

# A publish is never cancelled mid-flight: an interrupted `npm publish` can leave a version
# claimed on the registry that no run ever finished, and npm versions cannot be reused.
concurrency:
  group: release-dusk-crux-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  package:
    uses: Dusk-Inc/dusk-workspace/.github/workflows/package.yml@main
    # contents: write and pull-requests: write are the Changesets version job's, and are
    # granted here because a called workflow cannot widen the token the caller hands it.
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    with:
      unit: dusk-crux
      environment: npm
      ecosystem: npm
      path: '.'
      package_manager: npm
      access: public
      node_version: '24'
      changesets: true
