name: ci

# dusk-crux's gate stub, plus the repo's own build and test.
#
# Two jobs, and the split is deliberate:
#
#   `gates` is the house gate every repo calls — the same scanners .githooks/pre-commit runs,
#   over a whole checked-out tree rather than a staged diff, so a commit that reached the
#   branch with --no-verify is still caught. The job id MUST stay `gates` and MUST carry no
#   `name:`: GitHub reports a called workflow's check as "<caller job id> / <called job name>",
#   and repos/infra/github pins the required status check to "gates / gates". Rename either
#   half and the branch protection rule waits forever on a check nothing reports — the pull
#   request does not fail, it hangs, looking gated while being ungated.
#
#   `test` is this repo's own `npm ci && npm run build && npm test`, which the gates workflow
#   does not do and never will: gates runs scanners, not a Unit's suite. It is kept here rather
#   than left to release.yml's package call because that call runs inside the `npm` GitHub
#   environment, whose deployment branch policy currently admits only `main` and `v*` — so on
#   dev, staging and every pull request it is the only build-and-test that can actually start.
#
# Every branch on the ladder builds (dev -> staging -> main, main is prod); this workflow
# publishes nothing anywhere, so it needs no credential and no environment.

on:
  pull_request:
    branches: [dev, staging, main]
  push:
    branches: [dev, staging, main]
  workflow_dispatch:

# One gate run per ref. Cancellation is gated on pull request: a superseded pull request run is
# noise, while a push run is the record that the merged tree passes its own gate.
concurrency:
  group: ci-dusk-crux-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  gates:
    uses: Dusk-Inc/dusk-workspace/.github/workflows/gates.yml@main
    with:
      workspace_path: repos/projects/dusk-crux

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
